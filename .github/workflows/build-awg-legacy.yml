
name: Build AmneziaWG for OpenWrt 25.12 Legacy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300

    env:
      OPENWRT_COMMIT: 44b73b738d
      EXPECTED_KERNEL: "6.12.108"
      EXPECTED_ABI: "5a6c1f71be683ae9980b15d3ce73e24d"

    steps:
      - name: Checkout AmneziaWG sources
        uses: actions/checkout@v4
        with:
          path: awg

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gettext git libncurses-dev libssl-dev python3 \
            python3-pyelftools rsync unzip wget zstd \
            file subversion swig time

      - name: Checkout exact OpenWrt revision
        run: |
          git clone --filter=blob:none \
            https://github.com/openwrt/openwrt.git openwrt
          cd openwrt
          git checkout "$OPENWRT_COMMIT"
          git log -1 --oneline

      - name: Configure OpenWrt
        run: |
          set -e
          cd openwrt

          ./scripts/feeds update -a
          ./scripts/feeds install -a

          cp -r ../awg/kmod-amneziawg package/
          cp -r ../awg/amneziawg-tools package/
          cp -r ../awg/luci-proto-amneziawg package/

          cat > .config <<'EOF'
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_PACKAGE_kmod-amneziawg=m
          CONFIG_PACKAGE_amneziawg-tools=m
          CONFIG_PACKAGE_luci-proto-amneziawg=m
          EOF

          make defconfig

      - name: Build kernel and AmneziaWG
        run: |
          set -e
          cd openwrt

          make download -j8
          make tools/install -j2 V=s
          make toolchain/install -j2 V=s
          make target/linux/compile -j2 V=s
          make package/kmod-amneziawg/compile -j2 V=s
          make package/amneziawg-tools/compile -j2 V=s
          make package/luci-proto-amneziawg/compile -j2 V=s

      - name: Check kernel version and ABI
        run: |
          set -e
          cd openwrt

          echo "Expected kernel: $EXPECTED_KERNEL"
          echo "Expected ABI: $EXPECTED_ABI"

          echo "Kernel build metadata:"
          find staging_dir -name kernel-version.mk \
            -o -name vermagic \
            -o -name kernel.release

          echo "Generated packages:"
          find bin -type f -name '*amneziawg*.apk'

          python3 - <<'PY'
          import glob
          import os
          import subprocess
          import sys

          expected_kernel = os.environ["EXPECTED_KERNEL"]
          expected_abi = os.environ["EXPECTED_ABI"]

          files = glob.glob(
              "bin/targets/**/kmod-amneziawg-*.apk",
              recursive=True
          )

          if not files:
              sys.exit("ERROR: AmneziaWG kernel package not found")

          package = files[0]
          result = subprocess.run(
              ["apk", "adbdump", package],
              capture_output=True,
              text=True
          ) if subprocess.run(
              ["which", "apk"], capture_output=True
          ).returncode == 0 else None

          if result is None or result.returncode != 0:
              print("Cannot inspect APK metadata automatically")
              print("Package:", package)
              sys.exit(1)

          metadata = result.stdout
          print(metadata[:8000])

          if expected_kernel not in metadata:
              sys.exit("ERROR: kernel version mismatch")

          if expected_abi not in metadata:
              sys.exit("ERROR: kernel ABI mismatch")

          print("Kernel version and ABI match")
          PY

      - name: Upload packages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amneziawg-legacy-candidate
          path: |
            openwrt/bin/**/*.apk
          if-no-files-found: error
          retention-days: 7
